<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · CyberShop</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="container auth-wrap">
    <section class="auth-card">
      <h1>Crear cuenta</h1>
      <p class="muted">Regístrate para comprar y seguir tus pedidos.</p>
      <div id="form-alert" hidden role="alert"></div>
      <form id="register-form" novalidate>
        <div class="field">
          <label for="username">Nombre de usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="30">
          <small class="field-error" data-error-for="username"></small>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="120">
          <small class="field-error" data-error-for="email"></small>
        </div>
        <div class="field">
          <label for="full_name">Nombre completo (opcional)</label>
          <input id="full_name" name="full_name" type="text" autocomplete="name" maxlength="120">
          <small class="field-error" data-error-for="full_name"></small>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="3" maxlength="72">
          <small class="field-error" data-error-for="password"></small>
        </div>
        <p class="hint">Mínimo 3 caracteres.</p>
        <div class="field">
          <label for="password2">Repite la contraseña</label>
          <input id="password2" name="password2" type="password" autocomplete="new-password" required maxlength="72">
          <small class="field-error" data-error-for="password2"></small>
        </div>
        <button class="btn btn-block" type="submit">Crear cuenta</button>
      </form>
      <p class="auth-switch">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/forms.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
